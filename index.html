<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="프론트엔드, 백엔드, 클라우드 개발 지식을 읽고 복습하는 학습 앱"
    />
    <meta name="theme-color" content="#f4f0e8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/notion_technical_questions_final.txt?v=20260921-study-only-v1"
      as="fetch"
      crossorigin
    />
    <link rel="stylesheet" href="/styles.css?v=20260921-study-only-v1" />
    <title>개발한입</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="개발한입 홈">
          <span class="brand-mark">Q</span>
          <span>
            <strong>개발한입</strong>
            <small>Developer Study Notes</small>
          </span>
        </a>
        <div class="topbar-actions">
          <button class="icon-button sync-button" id="sync-open" type="button">
            동기화
          </button>
          <button class="icon-button install-button is-hidden" type="button">
            앱 설치
          </button>
        </div>
      </header>

      <main>
        <section class="view is-active" id="study-view">
          <div class="hero">
            <div class="hero-copy">
              <p class="eyebrow">오늘도 하나씩, 확실하게</p>
              <h1>개발 지식을<br /><em>내 언어</em>로 만들기</h1>
              <p class="hero-description">
                읽고, 가리고, 직접 말하며 익혀보세요.
              </p>
            </div>
            <div class="progress-card">
              <div class="progress-card-head">
                <span>전체 학습률</span>
                <strong id="progress-percent">0%</strong>
              </div>
              <div class="progress-track">
                <span id="progress-bar"></span>
              </div>
              <div class="progress-meta">
                <span><b id="completed-count">0</b>개 완료</span>
                <span>전체 <b id="total-count">0</b>개</span>
              </div>
            </div>
          </div>

          <div class="study-toolbar">
            <label class="search-box">
              <span class="search-icon" aria-hidden="true"></span>
              <input
                id="search-input"
                type="search"
                placeholder="질문이나 키워드 검색"
                autocomplete="off"
              />
            </label>
            <button class="filter-button" id="bookmark-filter" type="button">
              <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.9c.4 0 .8.3 1 .7l2.3 4.7 5.2.8c1 .1 1.4 1.4.7 2.1l-3.8 3.7.9 5.2c.2 1-.9 1.8-1.8 1.3L12 19l-4.6 2.4c-.9.5-2-.3-1.8-1.3l.9-5.2-3.8-3.7c-.7-.7-.3-2 .7-2.1l5.2-.8 2.3-4.7c.3-.4.7-.7 1.1-.7Z" />
              </svg>
              <span>북마크</span>
            </button>
          </div>

          <div class="category-tabs is-loading" id="category-tabs">
            <span class="tab-skeleton wide"></span>
            <span class="tab-skeleton"></span>
            <span class="tab-skeleton wide"></span>
            <span class="tab-skeleton"></span>
            <span class="tab-skeleton"></span>
          </div>

          <div class="section-heading">
            <div>
              <p class="eyebrow" id="result-eyebrow">ALL QUESTIONS</p>
              <h2 id="result-title">전체 질문</h2>
            </div>
            <button
              class="bulk-complete-button"
              id="bulk-complete"
              type="button"
            >
              모두 완료
            </button>
          </div>

          <div class="question-list is-loading" id="question-list">
            <div class="question-skeleton"></div>
            <div class="question-skeleton"></div>
            <div class="question-skeleton"></div>
            <div class="question-skeleton"></div>
          </div>
          <div class="empty-state is-hidden" id="study-empty">
            <strong>조건에 맞는 질문이 없습니다.</strong>
            <p>검색어나 필터를 변경해보세요.</p>
          </div>
        </section>

      </main>

      <div class="sync-modal is-hidden" id="sync-modal" role="dialog" aria-modal="true" aria-labelledby="sync-title">
        <div class="sync-modal-card">
          <button class="sync-close-button" id="sync-close" type="button" aria-label="동기화 설정 닫기">×</button>
          <p class="eyebrow">SYNC</p>
          <h2 id="sync-title">기기 동기화</h2>
          <p class="sync-description">
            같은 동기화 ID를 노트북, 데스크톱, 휴대폰에 입력하면 학습 완료와 북마크을 함께 사용합니다.
          </p>
          <label class="sync-field">
            <span>동기화 ID</span>
            <input
              id="sync-id-input"
              type="text"
              autocomplete="off"
              maxlength="80"
              placeholder="예: taejin-study"
            />
          </label>
          <p class="sync-status" id="sync-status" data-status="off">기기별로 저장 중</p>
          <div class="sync-actions">
            <button class="secondary-button" id="sync-now" type="button">
              불러오기
            </button>
            <button class="primary-button" id="sync-save" type="button">
              저장하기
            </button>
          </div>
        </div>
      </div>

    </div>

    <template id="question-template">
      <article class="question-card">
        <div class="question-header">
          <button class="question-main" type="button">
            <span class="question-index"></span>
            <span class="question-content">
              <small class="question-category"></small>
              <strong class="question-title"></strong>
            </span>
          </button>
          <div class="question-actions">
            <button class="complete-button" type="button">학습 미완료</button>
            <button class="bookmark-button" type="button" aria-label="북마크">
              <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.9c.4 0 .8.3 1 .7l2.3 4.7 5.2.8c1 .1 1.4 1.4.7 2.1l-3.8 3.7.9 5.2c.2 1-.9 1.8-1.8 1.3L12 19l-4.6 2.4c-.9.5-2-.3-1.8-1.3l.9-5.2-3.8-3.7c-.7-.7-.3-2 .7-2.1l5.2-.8 2.3-4.7c.3-.4.7-.7 1.1-.7Z" />
              </svg>
            </button>
          </div>
        </div>
        <div class="answer-panel">
          <div class="answer-panel-inner">
            <div class="answer-body"></div>
          </div>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js?v=20260921-study-only-v1"></script>
  </body>
</html>
